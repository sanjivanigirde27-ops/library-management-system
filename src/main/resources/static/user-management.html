<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management | THE PUSTAK REPOSITORY</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .user-page {
            padding: 30px;
            max-width: 1400px;
            margin: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            margin: 0;
        }

        .page-header p {
            margin: 6px 0 0;
            opacity: 0.7;
        }

        .add-user-btn {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .user-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            padding: 20px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            margin: 0 0 8px;
            font-size: 14px;
            opacity: 0.7;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
        }

        .user-content {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .refresh-btn {
            padding: 10px 18px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        .users-table th,
        .users-table td {
            padding: 13px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .users-table th {
            font-size: 13px;
            background: #f7f7f7;
        }

        .users-table td {
            font-size: 14px;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status.active {
            background: #e7f7ed;
            color: #16803c;
        }

        .status.inactive {
            background: #fbe9e9;
            color: #c62828;
        }

        .action-btn {
            border: none;
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 12px;
        }

        .edit-btn {
            background: #eee;
        }

        .delete-btn {
            background: #ffe5e5;
            color: #c62828;
        }

        .empty-message {
            text-align: center;
            padding: 35px;
            opacity: 0.6;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 14px;
            padding: 25px;
            box-sizing: border-box;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-btn {
            border: none;
            background: none;
            font-size: 25px;
            cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
        }

        .cancel-btn,
        .save-btn {
            padding: 10px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .cancel-btn {
            border: 1px solid #ccc;
            background: white;
        }

        .save-btn {
            border: none;
        }

        .message {
            display: none;
            padding: 12px 15px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: #e7f7ed;
            color: #16803c;
        }

        .message.error {
            display: block;
            background: #fbe9e9;
            color: #c62828;
        }

        @media (max-width: 700px) {
            .user-page {
                padding: 15px;
            }

            .user-stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="user-page">

    <!-- Header -->
    <div class="page-header">
        <div>
            <h1>User Management</h1>
            <p>Manage library members and their account information.</p>
        </div>

        <button class="add-user-btn" onclick="openAddUserModal()">
            + Add New User
        </button>
    </div>

    <!-- Statistics -->
    <div class="user-stats">

        <div class="stat-card">
            <h3>Total Users</h3>
            <div class="number" id="totalUsers">0</div>
        </div>

        <div class="stat-card">
            <h3>Active Users</h3>
            <div class="number" id="activeUsers">0</div>
        </div>

        <div class="stat-card">
            <h3>Inactive Users</h3>
            <div class="number" id="inactiveUsers">0</div>
        </div>

    </div>

    <!-- User Table -->
    <div class="user-content">

        <div id="message" class="message"></div>

        <div class="toolbar">

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by name, email, phone or department..."
                    oninput="searchUsers()"
                >
            </div>

            <button class="refresh-btn" onclick="loadUsers()">
                ↻ Refresh
            </button>

        </div>

        <div class="table-container">

            <table class="users-table">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>User Type</th>
                        <th>Department</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Registration Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="userTableBody">
                    <tr>
                        <td colspan="9" class="empty-message">
                            Loading users...
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- Add / Edit User Modal -->

<div class="modal" id="userModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">Add New User</h2>

            <button class="close-btn" onclick="closeUserModal()">
                &times;
            </button>

        </div>

        <form id="userForm">

            <input type="hidden" id="userId">

            <div class="form-grid">

                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input
                        type="text"
                        id="fullName"
                        required
                        placeholder="Enter full name"
                    >
                </div>

                <div class="form-group">
                    <label for="userType">User Type *</label>

                    <select id="userType" required>
                        <option value="">Select user type</option>
                        <option value="Student">Student</option>
                        <option value="Faculty">Faculty</option>
                        <option value="Staff">Staff</option>
                        <option value="Librarian">Librarian</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input
                        type="text"
                        id="department"
                        placeholder="Enter department"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="Enter email"
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone *</label>
                    <input
                        type="tel"
                        id="phone"
                        required
                        placeholder="Enter phone number"
                    >
                </div>

                <div class="form-group">
                    <label for="registrationDate">
                        Registration Date *
                    </label>

                    <input
                        type="date"
                        id="registrationDate"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="status">Status *</label>

                    <select id="status" required>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label for="address">Address</label>

                    <textarea
                        id="address"
                        placeholder="Enter address"
                    ></textarea>
                </div>

            </div>

            <div class="form-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeUserModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save User
                </button>

            </div>

        </form>

    </div>

</div>


<script src="user-management.js"></script>

</body>
</html>
