# ==========================================================
# Library Management System - Spring Boot Application Properties
# ==========================================================
server.port=8080
spring.application.name=library-management-system

# MySQL Database Configuration
# NOTE: Update username and password below if your local MySQL credentials differ
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Static resources mapping for frontend (HTML, CSS, JS)
spring.web.resources.static-locations=classpath:/static/

# SQL initialization (optional - loads sample records if tables are empty)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
